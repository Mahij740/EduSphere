<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduSphere - Add Student</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Backdrop Overlay for Mobile -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <span class="brand-title">EduSphere</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Dashboard</span>
        </a>
        <a href="/students" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>All Students</span>
        </a>
        <a href="/students/add" class="nav-item active">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>Add Student</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="logout-btn" id="logoutBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Mobile Header -->
      <header class="mobile-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="brand-logo" style="width: 32px; height: 32px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path></svg>
          </div>
          <span class="brand-title" style="font-size: 1.15rem;">EduSphere</span>
        </div>
        <button id="hamburgerBtn" class="hamburger-btn" aria-label="Toggle navigation">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </header>

      <main class="content-body">
        <div class="page-header" style="max-width: 640px; margin: 0 auto 28px auto;">
          <div class="page-title-group">
            <h1>Register New Student</h1>
            <p>Enter the student information to record enrollment in EduSphere.</p>
          </div>
        </div>

        <!-- Add Student Form Container -->
        <div class="form-card">
          <form id="addStudentForm" novalidate>
            <!-- Auto Generated Student ID Field -->
            <div class="form-group">
              <label for="studentId" class="form-label">Student ID</label>
              <input 
                type="text" 
                id="studentId" 
                class="form-input" 
                value="Auto-generated" 
                disabled 
                readonly
              >
            </div>

            <!-- Student Name -->
            <div class="form-group">
              <label for="studentName" class="form-label">Full Name *</label>
              <input 
                type="text" 
                id="studentName" 
                class="form-input" 
                placeholder="e.g. Alexandra Vance" 
                required
              >
              <div class="field-error" id="nameError"></div>
            </div>

            <!-- Student Email -->
            <div class="form-group">
              <label for="studentEmail" class="form-label">Email Address *</label>
              <input 
                type="email" 
                id="studentEmail" 
                class="form-input" 
                placeholder="e.g. alexandra.vance@university.edu" 
                required
              >
              <div class="field-error" id="emailError"></div>
            </div>

            <!-- Searchable Custom Course Dropdown -->
            <div class="form-group">
              <label class="form-label">Course / Major *</label>
              <div class="custom-select-wrapper" id="courseSelectWrapper">
                <input type="hidden" id="selectedCourseValue" required>
                <div class="custom-select-trigger" id="courseSelectTrigger" tabindex="0">
                  <span id="selectedCourseLabel" style="color: var(--text-muted);">Select or type to search course...</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                <div class="custom-select-dropdown" id="courseDropdown">
                  <div class="custom-select-search">
                    <input type="text" id="courseSearchInput" placeholder="Filter courses or type custom name..." autocomplete="off">
                  </div>
                  <div class="custom-select-options" id="courseOptionsList">
                    <!-- Populated dynamically by add-student.js -->
                  </div>
                </div>
              </div>
              <div class="field-error" id="courseError"></div>
            </div>

            <!-- Student Age -->
            <div class="form-group">
              <label for="studentAge" class="form-label">Age * (5 - 100)</label>
              <input 
                type="number" 
                id="studentAge" 
                class="form-input" 
                placeholder="e.g. 21" 
                min="5" 
                max="100" 
                required
              >
              <div class="field-error" id="ageError"></div>
            </div>

            <!-- Action Buttons -->
            <div class="form-actions">
              <a href="/students" class="btn btn-secondary" style="flex: 1;">Cancel</a>
              <button type="submit" class="btn btn-primary" id="saveStudentBtn" style="flex: 2;">
                Save Student
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/add-student.js"></script>
</body>
</html>
